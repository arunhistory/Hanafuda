name: Inspect impossible clear assets

on:
  workflow_dispatch:
  push:
    branches: [impossible-clear-screen-v1]
    paths:
      - '.github/workflows/inspect-impossible-clear-assets.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impossible-clear-screen-v1
      - name: Inspect exact uploaded PNGs
        run: |
          set -euo pipefail
          files=(
            '471D08C1-C52A-4CEB-9D26-858A671E3441.png'
            'ADA663A4-FE66-4A57-9975-A8FC1ED17BDF.png'
            'C5DF80CE-2E35-4AC7-899D-004CE0740BF8.png'
          )
          for f in "${files[@]}"; do
            echo "=== $f ==="
            file "$f"
            sha256sum "$f"
            python3 -c 'import struct,sys; b=open(sys.argv[1],"rb").read(33); assert b[:8]==b"\x89PNG\r\n\x1a\n"; w,h=struct.unpack(">II",b[16:24]); print(f"PNG_DIMENSIONS={w}x{h} COLOR_TYPE={b[25]}")' "$f"
          done
      - name: Compute perceptual hashes
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          for f in 471D08C1-C52A-4CEB-9D26-858A671E3441.png ADA663A4-FE66-4A57-9975-A8FC1ED17BDF.png C5DF80CE-2E35-4AC7-899D-004CE0740BF8.png; do
            echo "=== PHASH $f ==="
            python3 -c 'from PIL import Image; from functools import reduce; import sys; p=sys.argv[1]; im=Image.open(p).convert("L").resize((16,16)); v=list(im.getdata()); a=sum(v)/len(v); ah=reduce(lambda z,x:(z<<1)|(1 if x>=a else 0),v,0); im2=Image.open(p).convert("L").resize((17,16)); q=list(im2.getdata()); bits=[q[y*17+x]>q[y*17+x+1] for y in range(16) for x in range(16)]; dh=reduce(lambda z,x:(z<<1)|(1 if x else 0),bits,0); print(f"AHASH={ah:064x}"); print(f"DHASH={dh:064x}")' "$f"
          done
