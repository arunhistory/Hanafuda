name: Settings Cloud Content v1

on:
  push:
    branches: [settings-cloud-content-v1]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: settings-cloud-content-v1
          fetch-depth: 0

      - name: Apply settings Cloud content changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(s, old, new, label):
              count=s.count(old)
              if count!=1: raise SystemExit(f'{label}: expected one anchor, got {count}')
              return s.replace(old,new,1)

          # Frontend shared types/client.
          p=Path('web/src/core.ts'); s=p.read_text()
          s=replace_once(s,
            'type UiScreen = "home" | "cpu-setup" | "online" | "settings" | "rules" | "yaku" | "match";',
            'type UiScreen = "home" | "cpu-setup" | "online" | "settings" | "terms" | "credits" | "licenses" | "rules" | "yaku" | "match";',
            'core UiScreen')
          s=replace_once(s,
            'type FirstDealer = -1 | 0 | 1;\n\n',
            'type FirstDealer = -1 | 0 | 1;\n\ntype CloudContentKey = "terms" | "credits" | "licenses";\ntype CloudContentDocument = {key:CloudContentKey;available:boolean;revision:number;body:unknown};\n\n',
            'core content types')
          client='''async function fetchCloudContent(key:CloudContentKey):Promise<CloudContentDocument>{
            const response=await fetch(`${API_BASE}/v1/content/${key}`,{method:"GET",headers:{accept:"application/json"},cache:"no-store",credentials:"omit",redirect:"error"});
            if(!response.ok)throw new Error(`CONTENT_HTTP_${response.status}`);
            if(!(response.headers.get("content-type")??"").toLowerCase().includes("application/json"))throw new Error("CONTENT_INVALID_CONTENT_TYPE");
            const value=await response.json() as Record<string,unknown>;
            if(value.key!==key||typeof value.available!=="boolean")throw new Error("CONTENT_INVALID_RESPONSE");
            const revision=Number(value.revision);
            if(!Number.isSafeInteger(revision)||revision<0)throw new Error("CONTENT_INVALID_REVISION");
            return {key,available:value.available,revision,body:value.body};
          }
          '''
          s=replace_once(s,'function modeLabel(mode:CpuMode)',client+'function modeLabel(mode:CpuMode)','core client insertion')
          p.write_text(s)

          # Settings/document UI.
          p=Path('web/src/views.ts'); s=p.read_text()
          s=replace_once(s,
            '  else if(screen==="settings")renderSettingsScreen();\n  else if(screen==="rules")renderRules();\n',
            '  else if(screen==="settings")renderSettingsScreen();\n  else if(screen==="terms")await renderCloudDocumentScreen("terms","利用規約");\n  else if(screen==="credits")await renderCloudDocumentScreen("credits","クレジット");\n  else if(screen==="licenses")await renderCloudDocumentScreen("licenses","ライセンス");\n  else if(screen==="rules")renderRules();\n',
            'views render routes')
          old='''function renderSettingsScreen(){
            app.innerHTML=`<main class="${screenClass()}">${topbar("設定")}<section class="panel"><div class="settings-grid"><label for="skip-animations">通常演出</label><div class="check-row"><input id="skip-animations" type="checkbox" ${settings.skipNormalAnimations?"checked":""}><span>通常演出をスキップ</span></div><label>音響</label><div class="notice">BGM / SE は現在の画面・メニュー・人知不能演出に連動します。</div></div><div class="screen-actions"><button class="secondary" data-nav="rules">詳細ルール</button></div></section></main>`;
          }

          '''
          new='''function renderSettingsScreen(){
            app.innerHTML=`<main class="${screenClass()}">${topbar("設定")}<section class="panel"><div class="settings-grid"><label for="skip-animations">通常演出</label><div class="check-row"><input id="skip-animations" type="checkbox" ${settings.skipNormalAnimations?"checked":""}><span>通常演出をスキップ</span></div><label>音響</label><div class="notice">BGM / SE は現在の画面・メニュー・人知不能演出に連動します。</div></div><div class="screen-actions"><button class="secondary" data-nav="rules">詳細ルール</button><button class="secondary" data-nav="terms">利用規約</button><button class="secondary" data-nav="credits">クレジット</button><button class="secondary" data-nav="licenses">ライセンス</button></div></section></main>`;
          }

          async function renderCloudDocumentScreen(key:CloudContentKey,title:string){
            const expected=key as UiScreen;
            app.innerHTML=`<main class="${screenClass()}">${topbar(title)}<section class="panel rules-copy"><div id="cloud-content-state" class="notice">読み込み中…</div></section></main>`;
            try{
              const documentValue=await fetchCloudContent(key);
              if(currentScreen()!==expected)return;
              const state=app.querySelector<HTMLElement>("#cloud-content-state");
              if(!state)return;
              if(!documentValue.available){state.textContent="現在、本文は未登録です。";return;}
              if(typeof documentValue.body!=="string"){state.textContent="本文を取得できませんでした。";return;}
              const container=document.createElement("div");
              container.className="cloud-document-body";
              for(const block of documentValue.body.split(/\n{2,}/)){
                const p=document.createElement("p");
                p.textContent=block;
                container.append(p);
              }
              state.replaceWith(container);
            }catch{
              if(currentScreen()!==expected)return;
              const state=app.querySelector<HTMLElement>("#cloud-content-state");
              if(state)state.textContent="本文を取得できませんでした。";
            }
          }

          '''
          s=replace_once(s,old,new,'views settings')
          p.write_text(s)

          # Cloudflare read-only content contract. No new storage/binding/DO.
          p=Path('cloudflare/v3-src/worker-v3.ts'); s=p.read_text()
          marker='export {BaseModeSession as HanafudaModeSession,HanafudaCpuSessionDealer as HanafudaCpuSession,HanafudaOnlineRoom,HanafudaDirectory};\n\n'
          content='''export {BaseModeSession as HanafudaModeSession,HanafudaCpuSessionDealer as HanafudaCpuSession,HanafudaOnlineRoom,HanafudaDirectory};

          type ContentKey="terms"|"credits"|"licenses";
          const TERMS_BODY=`花札 利用規約

          本ゲームは無料でご利用いただけるフリーゲームです。

          本ゲームは公開前に安全性の確認を行っていますが、プレイおよび利用については各自の責任でお楽しみください。

          本ゲームおよび本ゲーム内で使用されているプログラム、画像、文章その他のコンテンツについて、権利者の許可なく転載、再配布、改変して配布することを禁止します。

          本ゲームで使用しているライセンスおよびクレジットについては、本利用規約とは別に記載しています。

          本ゲームの内容は、予告なく変更、更新、または公開を終了する場合があります。

          本ゲームを利用した時点で、本利用規約に同意したものとします。`;

          function contentDocument(req:Request,env:any,key:ContentKey){
            if(req.method!=="GET")return cors(json({ok:false,code:"METHOD_NOT_ALLOWED"},405),req,env);
            if(key==="terms")return cors(json({key,available:true,revision:1,body:TERMS_BODY}),req,env);
            return cors(json({key,available:false,revision:0,body:null}),req,env);
          }

          '''
          s=replace_once(s,marker,content,'worker content insertion')
          s=replace_once(s,
            '    if(url.pathname==="/api/audio/profile")return audioProfile(req,env);\n',
            '    if(url.pathname==="/api/audio/profile")return audioProfile(req,env);\n    const contentMatch=url.pathname.match(/^\\/v1\\/content\\/(terms|credits|licenses)$/);\n    if(contentMatch)return contentDocument(req,env,contentMatch[1] as ContentKey);\n',
            'worker content route')
          p.write_text(s)

          # Extend existing contracts.
          p=Path('tests/web_frontend_contract.test.mjs'); s=p.read_text()
          marker="  ['settings rules yaku hierarchy exists',ts.includes('\"rules\" | \"yaku\" | \"match\"')&&ts.includes('data-nav=\"rules\">詳細ルール')&&ts.includes('data-nav=\"yaku\">得点・役確認')&&ts.includes('function renderYakuScreen()')],\n"
          extra=marker+"  ['settings exposes Cloudflare terms credits and licenses',ts.includes('data-nav=\"terms\">利用規約')&&ts.includes('data-nav=\"credits\">クレジット')&&ts.includes('data-nav=\"licenses\">ライセンス')],\n  ['settings content client reads only through Hanafuda Cloudflare',ts.includes('`${API_BASE}/v1/content/${key}`')&&ts.includes('cache:\"no-store\"')&&ts.includes('credentials:\"omit\"')&&ts.includes('redirect:\"error\"')],\n  ['unregistered and fetch-failure messages match Shogi behavior',ts.includes('現在、本文は未登録です。')&&ts.includes('本文を取得できませんでした。')],\n  ['Cloud content string is rendered as text rather than executable HTML',ts.includes('p.textContent=block')&&!ts.includes('innerHTML=documentValue.body')&&!ts.includes('innerHTML=String(documentValue.body)')],\n  ['terms body is not hardcoded in public frontend',!ts.includes('本ゲームは無料でご利用いただけるフリーゲームです。')],\n"
          s=replace_once(s,marker,extra,'web contract')
          p.write_text(s)

          p=Path('tests/cloudflare_gateway_contract.test.mjs'); s=p.read_text()
          marker="  ['developer auto-start override is disabled',!workerSrc.includes('developerModeStartRequest')&&!workerSrc.includes('x-hanafuda-developer')&&!workerSrc.includes('DEVELOPER_MODE_KEY')],\n"
          extra=marker+"  ['Cloud content route exposes terms credits licenses read-only',workerSrc.includes('v1\\\\/content\\\\/(terms|credits|licenses)')&&workerSrc.includes('if(req.method!==\"GET\")')],\n  ['Cloud terms content is registered',workerSrc.includes('花札 利用規約')&&workerSrc.includes('available:true,revision:1,body:TERMS_BODY')],\n  ['credits and licenses have no body yet',workerSrc.includes('available:false,revision:0,body:null')&&!workerSrc.includes('CREDITS_BODY')&&!workerSrc.includes('LICENSES_BODY')],\n"
          s=replace_once(s,marker,extra,'cloudflare contract')
          p.write_text(s)
          PY

      - name: Compile web TypeScript
        run: |
          rm -rf /tmp/hanafuda-web-dist
          npx --yes --package typescript@5.8.3 tsc -p web/tsconfig.json --outDir /tmp/hanafuda-web-dist
          find /tmp/hanafuda-web-dist -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run frontend contracts
        run: |
          node tests/web_frontend_contract.test.mjs
          node tests/online_animation_contract.test.mjs
          node tests/deal_animation_contract.test.mjs
          node tests/mobile_landscape_contract.test.mjs
          node tests/match_pacing_contract.test.mjs
          node tests/turn_selection_contract.test.mjs
          node tests/mobile_match_visibility_and_cpu_capture.test.mjs
          node tests/pregame_gate_contract.test.mjs
          node tests/pages_publication_contract.test.mjs
          node tests/impossible_clear_screen_contract.test.mjs

      - name: Compile Cloudflare v3 and run contract
        run: |
          rm -rf /tmp/hanafuda-cf-dist
          npx --yes --package typescript@5.8.3 tsc -p cloudflare/tsconfig.v3.json --outDir /tmp/hanafuda-cf-dist
          find /tmp/hanafuda-cf-dist -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/cloudflare_gateway_contract.test.mjs

      - name: Assert unresolved documents remain empty
        run: |
          ! grep -R -E 'CREDITS_BODY|LICENSES_BODY|credits.*available:true|licenses.*available:true' cloudflare/v3-src web/src

      - name: Commit validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/core.ts web/src/views.ts cloudflare/v3-src/worker-v3.ts tests/web_frontend_contract.test.mjs tests/cloudflare_gateway_contract.test.mjs
          git commit -m 'Add Cloudflare-backed settings documents [skip ci]'
          git push origin HEAD:settings-cloud-content-v1
