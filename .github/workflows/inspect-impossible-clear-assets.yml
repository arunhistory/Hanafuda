name: Inspect impossible clear assets

on:
  workflow_dispatch:
  push:
    branches: [impossible-clear-screen-v1]
    paths:
      - '.github/workflows/inspect-impossible-clear-assets.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impossible-clear-screen-v1
      - name: Inspect exact uploaded PNGs
        run: |
          set -euo pipefail
          files=(
            '471D08C1-C52A-4CEB-9D26-858A671E3441.png'
            'ADA663A4-FE66-4A57-9975-A8FC1ED17BDF.png'
            'C5DF80CE-2E35-4AC7-899D-004CE0740BF8.png'
          )
          for f in "${files[@]}"; do
            echo "=== $f ==="
            file "$f"
            sha256sum "$f"
            python3 -c 'import struct,sys; b=open(sys.argv[1],"rb").read(33); assert b[:8]==b"\x89PNG\r\n\x1a\n"; w,h=struct.unpack(">II",b[16:24]); print(f"PNG_DIMENSIONS={w}x{h} COLOR_TYPE={b[25]}")' "$f"
          done
      - name: Compute normalized pixel hashes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          for f in 471D08C1-C52A-4CEB-9D26-858A671E3441.png ADA663A4-FE66-4A57-9975-A8FC1ED17BDF.png C5DF80CE-2E35-4AC7-899D-004CE0740BF8.png; do
            echo "=== PIXEL64 $f ==="
            convert "$f" -background white -alpha background -alpha off -resize 64x64\! -colorspace sRGB rgb:- | sha256sum
          done
