name: Build Hanafuda web app

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '_config.yml'
      - 'tests/web_frontend_contract.test.mjs'
      - 'tests/online_animation_contract.test.mjs'
      - 'tests/deal_animation_contract.test.mjs'
      - 'tests/mobile_landscape_contract.test.mjs'
      - 'tests/match_pacing_contract.test.mjs'
      - 'tests/turn_selection_contract.test.mjs'
      - 'tests/mobile_match_visibility_and_cpu_capture.test.mjs'
      - 'tests/pregame_gate_contract.test.mjs'
      - 'tests/pages_publication_contract.test.mjs'
      - '.github/workflows/build-web.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hanafuda-web-main
  cancel-in-progress: true

jobs:
  build-validate-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Compile TypeScript frontend
        run: |
          rm -rf web/dist
          npx --yes --package typescript@5.8.3 tsc -p web/tsconfig.json
      - name: Copy audio driver WASM runtime
        run: |
          find web/src/audio-driver -type f -name '*.wasm' -print0 | while IFS= read -r -d '' f; do
            target="web/dist/${f#web/src/}"
            mkdir -p "$(dirname "$target")"
            cp "$f" "$target"
          done
      - name: Validate generated JavaScript syntax
        run: |
          find web/dist -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run frontend contract tests
        run: |
          node tests/web_frontend_contract.test.mjs
          node tests/online_animation_contract.test.mjs
          node tests/deal_animation_contract.test.mjs
          node tests/mobile_landscape_contract.test.mjs
          node tests/match_pacing_contract.test.mjs
          node tests/turn_selection_contract.test.mjs
          node tests/mobile_match_visibility_and_cpu_capture.test.mjs
          node tests/pregame_gate_contract.test.mjs
          node tests/pages_publication_contract.test.mjs
      - name: Reject secrets and hidden trigger details
        run: |
          if grep -R -E 'DEVELOPER_MODE_KEY|x-hanafuda-developer|SUPABASE_SERVICE_ROLE_KEY|playerTotal|cpuTotal|should_force_impossible' web; then
            echo 'Sensitive or hidden-mode internals leaked into public web app.' >&2
            exit 1
          fi
      - name: Commit generated frontend artifact if changed
        run: |
          if git status --porcelain -- web/dist | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add web/dist
            git commit -m 'Build web frontend artifact [skip ci]'
            git push origin HEAD:main
          else
            echo 'Frontend artifact is already current.'
          fi
