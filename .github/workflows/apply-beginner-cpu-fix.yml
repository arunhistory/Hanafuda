name: Apply beginner CPU fix

on:
  push:
    paths:
      - '.github/workflows/apply-beginner-cpu-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch beginner CPU policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('cloudflare/v3-src/cpu-session.ts')
          s=p.read_text()
          new='''  async runCpu(events:any[]){\n    const mode=String(await this.state.storage.get("mode")??"");\n    for(let guard=0;guard<8;guard++){\n      const last=events[events.length-1];\n      const snap=last?.snapshot;\n      if(!snap||snap.turn!==1||!CPU_PHASES.has(Number(snap.phase)))return {ok:true};\n      let result:any;\n      if(mode==="beginner"){\n        const phase=Number(snap.phase);\n        const randomIndex=(n:number)=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return n>0?a[0]%n:0;};\n        if(phase===1){\n          const count=Math.max(0,Number(snap.opponentHandCount??0));\n          if(count<1)return {ok:false,response:json({ok:false,code:"BEGINNER_NO_HAND"},500)};\n          result=await this.engineAction({action:"play",actor:1,handIndex:randomIndex(count)});\n        }else if(phase===2||phase===3){\n          const pending=Array.isArray(snap.pendingMatches)?snap.pendingMatches.filter((x:any)=>Number.isInteger(Number(x))).map(Number):[];\n          if(!pending.length)return {ok:false,response:json({ok:false,code:"BEGINNER_NO_CAPTURE"},500)};\n          result=await this.engineAction({action:"capture",actor:1,fieldIndex:pending[randomIndex(pending.length)]});\n        }else if(phase===4){\n          const a=new Uint32Array(1);crypto.getRandomValues(a);\n          result=await this.engineAction({action:"koi",actor:1,chooseKoi:(a[0]&1)===1});\n        }else return {ok:true};\n      }else{\n        result=await this.engineAction({action:"cpu_step",actor:1});\n      }\n      if(!result.ok||!result.data?.ok)return {ok:false,response:json({ok:false,code:"CPU_ENGINE_FAILED",detail:result.data?.code??null},result.status||502)};\n      events.push({actor:"cpu",snapshot:result.data.snapshot,version:Number(result.data.version),actionEvent:result.data?.actionEvent??null});\n      if(result.data?.modeTransition?.transition==="impossible"){\n        await this.state.storage.put({pendingTransition:true,forcedRounds:Number(result.data.modeTransition.forcedRounds??6),pendingModeTransition:result.data.modeTransition});\n        return {ok:true,modeTransition:result.data.modeTransition};\n      }\n      await this.maybeGrantUnlock(result.data.snapshot);\n    }\n    return {ok:false,response:json({ok:false,code:"CPU_STEP_GUARD"},500)};\n  }\n\n'''
          pattern=r'  async runCpu\(events:any\[\]\)\{.*?\n  \}\n\n(?=  async ready\(\)\{)'
          out,n=re.subn(pattern,new,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'runCpu patch count={n}')
          p.write_text(out)
          PY
      - name: Verify patch markers
        run: |
          grep -q 'mode==="beginner"' cloudflare/v3-src/cpu-session.ts
          grep -q 'BEGINNER_NO_HAND' cloudflare/v3-src/cpu-session.ts
          grep -q 'action:"cpu_step",actor:1' cloudflare/v3-src/cpu-session.ts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/v3-src/cpu-session.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Make beginner CPU deliberately novice'
          git push
