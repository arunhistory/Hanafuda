name: Validate impossible future planner

on:
  push:
    branches: [impossible-future-planner-v1]
    paths:
      - 'src/core/**'
      - 'tools/build_engine_wasm.sh'
      - 'tests/impossible_strength.test.mjs'
      - '.github/workflows/test-impossible-planner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impossible-future-planner-v1
          fetch-depth: 0
      - name: Install WebAssembly linker
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
      - name: Build authoritative engine
        run: bash tools/build_engine_wasm.sh
      - name: Run existing simulations
        run: |
          node tests/game_rules_contract.test.mjs
          node tests/game_simulation.test.mjs
      - name: Run impossible acceptance benchmark
        run: node tests/impossible_strength.test.mjs
      - name: Record engine artifact
        if: success()
        run: |
          sha256sum assets/wasm/hanafuda_engine.wasm
          if git diff --quiet -- assets/wasm/hanafuda_engine.wasm; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wasm/hanafuda_engine.wasm
          git commit -m 'Build impossible planner engine artifact [skip ci]'
          git push origin HEAD:impossible-future-planner-v1
