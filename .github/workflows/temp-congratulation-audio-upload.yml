name: Temporary congratulation audio upload

on:
  push:
    branches: [temp-congratulation-audio-upload]
    paths:
      - '.github/workflows/temp-congratulation-audio-upload.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and upload exact OGG asset
        shell: bash
        env:
          SUPABASE_URL: https://mpuhgfbdkxmhynytwhzu.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wdWhnZmJka3htaHlueXR3aHp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNzcxMDYsImV4cCI6MjEwMjk1MzEwNn0.BHfuNFZtHCEopBsnZMmC9nF9ophzJPMY3O4k3_qR3Qs
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -maxdepth 1 -type f -name '*.ogg' -print0)
          test "${#files[@]}" -eq 1
          src="${files[0]}"
          size="$(stat -c%s "$src")"
          test "$size" -gt 0
          test "$size" -le 20000000
          test "$(head -c 4 "$src" | xxd -p)" = "4f676753"
          before="$(sha256sum "$src" | awk '{print $1}')"
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/storage/v1/object/hanafuda-audio/congratulation-bgm.ogg" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: audio/ogg' \
            -H 'x-upsert: false' \
            --data-binary "@$src"
          curl --fail --silent --show-error \
            "$SUPABASE_URL/storage/v1/object/public/hanafuda-audio/congratulation-bgm.ogg" \
            -o /tmp/congratulation-bgm.ogg
          after="$(sha256sum /tmp/congratulation-bgm.ogg | awk '{print $1}')"
          test "$before" = "$after"
          test "$size" -eq "$(stat -c%s /tmp/congratulation-bgm.ogg)"
          echo "SHA256=$after"
          echo "SIZE=$size"
