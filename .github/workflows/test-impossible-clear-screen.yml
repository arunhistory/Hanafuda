name: Test impossible clear screen

on:
  push:
    branches:
      - impossible-clear-screen-v1
    paths:
      - 'web/src/final-result-fix-v1.ts'
      - 'web/final-result-fix-v1.css'
      - 'tests/impossible_clear_screen_contract.test.mjs'
      - '.github/workflows/test-impossible-clear-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impossible-clear-screen-v1
      - name: Compile TypeScript frontend
        run: |
          rm -rf web/dist
          npx --yes --package typescript@5.8.3 tsc -p web/tsconfig.json
      - name: Copy audio driver WASM runtime
        run: |
          find web/src/audio-driver -type f -name '*.wasm' -print0 | while IFS= read -r -d '' f; do
            target="web/dist/${f#web/src/}"
            mkdir -p "$(dirname "$target")"
            cp "$f" "$target"
          done
      - name: Validate generated JavaScript syntax
        run: find web/dist -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run existing frontend contracts
        run: |
          node tests/web_frontend_contract.test.mjs
          node tests/online_animation_contract.test.mjs
          node tests/deal_animation_contract.test.mjs
          node tests/mobile_landscape_contract.test.mjs
          node tests/match_pacing_contract.test.mjs
          node tests/turn_selection_contract.test.mjs
          node tests/mobile_match_visibility_and_cpu_capture.test.mjs
          node tests/pregame_gate_contract.test.mjs
          node tests/pages_publication_contract.test.mjs
      - name: Run impossible clear screen contract
        run: node tests/impossible_clear_screen_contract.test.mjs
      - name: Reject secrets and hidden trigger details
        run: |
          if grep -R -E 'DEVELOPER_MODE_KEY|x-hanafuda-developer|SUPABASE_SERVICE_ROLE_KEY|playerTotal|cpuTotal|should_force_impossible' web; then
            echo 'Sensitive or hidden-mode internals leaked into public web app.' >&2
            exit 1
          fi
